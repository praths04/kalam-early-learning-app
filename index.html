<!-- Kalam — v3 (2026-08-08): renamed from Humara Saathi. Pencil mascot, page-by-page flow.
     Tap-menu is the sole, primary entry point. See angan-project-notes.md for the full changelog. -->
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>कलम — Kalam</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C98A1F">
<link rel="icon" href="icon-192-pencil2.png">
<link rel="apple-touch-icon" href="icon-192-pencil2.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalam">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#C98A1F; --accent-dark:#96650F; --accent-tint:#FBEFD6; --ink:#3A2E27;
    --leaf:#5B7B4F; --leaf-dark:#3F5936; --card:#FFFFFF; --muted:#8A7A6E;
    --shadow: 0 2px 10px rgba(58,46,39,0.10);
    --font-head:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --font-body:'Outfit',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);font-weight:400;background:#FFFFFF;color:var(--ink);}
  h1,h2,h3,h4,.btn,.logo-text,select{font-family:var(--font-head);}
  .wrap{max-width:640px;min-height:100vh;margin:0 auto;padding:16px 14px 70px;display:flex;flex-direction:column;justify-content:center;}
  header.top{text-align:center;padding:14px 0 18px;display:flex;flex-direction:column;align-items:center;gap:10px;}
  header.top .logo-text{font-size:22px;font-weight:800;color:var(--accent-dark);}
  header.top .logo-text .en{font-family:var(--font-body);display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:1px;}
  .tracker{width:100%;max-width:260px;}
  .tracker-track{background:var(--accent-tint);border-radius:999px;height:9px;overflow:hidden;}
  .tracker-fill{background:var(--leaf);height:100%;border-radius:999px;transition:width 0.3s;}
  .tracker-text{font-size:11px;color:var(--muted);margin:5px 0 0;font-weight:500;}
  .page{animation:pageIn 0.25s ease;}
  @keyframes pageIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .done-btn{background:var(--leaf);margin-top:16px;}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1.5px solid var(--accent-tint);}
  .card h3{margin:0 0 2px;font-size:15px;color:var(--accent-dark);font-weight:700;}
  .card .h3-en{margin:0 0 10px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;font-weight:500;}
  select{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--accent);font-size:15px;font-weight:600;background:#FFFDF9;color:var(--ink);}
  .btn{display:block;width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;background:var(--accent);margin-top:12px;}
  .btn .en{font-family:var(--font-body);display:block;font-weight:500;font-size:12px;opacity:0.9;}
  .btn.secondary{background:var(--leaf);}
  .btn.ghost{background:#fff;color:var(--accent-dark);border:2px solid var(--accent);}
  .btn:disabled{background:#E3CFA0;cursor:not-allowed;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
  .tile{background:#FFFDF9;border:1.5px solid var(--accent-tint);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0;}
  .tile .photo{height:56px;}
  .tile .label{padding:6px 7px;}
  .tile .hi{font-family:var(--font-head);font-size:13px;font-weight:700;margin:0;color:var(--ink);}
  .tile .en{font-size:10.5px;color:var(--muted);margin:0;}
  .tile.selected{outline:2px solid var(--accent);}
  .yesno{display:flex;gap:10px;margin-top:10px;}
  .yesno button{flex:1;}
  .activity{background:#FFFDF9;border:1.5px solid var(--accent-tint);border-radius:14px;padding:16px;margin-top:14px;}
  .tier-pill{display:inline-block;background:var(--accent-tint);color:var(--accent-dark);font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:8px;}
  .tier-pill .en{font-weight:500;opacity:0.85;}
  .activity-note{background:#FFF8E8;border-left:3px solid var(--accent);padding:8px 10px;border-radius:6px;font-size:12.5px;margin:8px 0 4px;line-height:1.45;}
  .activity-note .en{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;}
  .activity h4{font-family:var(--font-head);margin:0 0 2px;font-size:16.5px;}
  .activity h4 .en{font-family:var(--font-body);display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:1px;}
  .activity .meta{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .activity ol{margin:0;padding-left:20px;font-size:14.5px;line-height:1.5;}
  .activity ol li{margin-bottom:8px;}
  .activity ol li .en{display:block;font-size:12px;color:var(--muted);margin-top:2px;}
  .activity .fallback{background:var(--accent-tint);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13.5px;}
  .activity .fallback .en{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;}
  .activity .skill-tag{display:inline-block;background:var(--leaf);color:#fff;font-size:11.5px;padding:3px 9px;border-radius:999px;font-weight:600;margin-top:10px;}
  .activity .skill-tag .en{opacity:0.85;font-size:10.5px;}
  .speak-btn{display:inline-flex;align-items:center;gap:5px;background:var(--accent-tint);color:var(--accent-dark);border:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px;}
  .checkin{margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--accent-tint);}
  .checkin .ci-title{font-family:var(--font-head);font-size:12.5px;font-weight:700;color:var(--accent-dark);margin:0 0 8px;}
  .checkin .ci-q{font-size:14px;margin:0 0 2px;font-weight:600;}
  .checkin .ci-q-en{font-size:11.5px;color:var(--muted);margin:0 0 6px;}
  .checkin .ci-faces{display:flex;gap:8px;margin-bottom:12px;}
  .checkin .ci-faces button{flex:1;padding:8px 4px;border-radius:10px;border:1.5px solid var(--accent-tint);background:#fff;font-size:18px;cursor:pointer;}
  .checkin .ci-faces button.picked{border-color:var(--accent);background:var(--accent-tint);}
  .checkin .ci-faces button span{display:block;font-size:9.5px;color:var(--muted);margin-top:2px;font-weight:600;}
  .checkin-submit{display:block;width:100%;padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:var(--font-head);cursor:pointer;color:#fff;background:var(--leaf-dark);margin-top:6px;}
  .checkin-submit.saved{background:#3F5936;}
  .checkin-saved-msg{text-align:center;font-size:12.5px;color:var(--leaf-dark);font-weight:600;margin-top:8px;display:none;}
  .home-btn{position:fixed;top:12px;left:12px;z-index:50;width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    background:#fff;border:2px solid var(--accent);box-shadow:var(--shadow);cursor:pointer;padding:0;}
  .home-btn .icon{font-size:20px;line-height:1;}
  .logo-badge{position:fixed;top:12px;right:12px;z-index:50;width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    background:#fff;border:2px solid var(--accent);box-shadow:var(--shadow);overflow:hidden;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
  .logo-badge svg{width:30px;height:auto;transform:translateY(3px);}
  .growth-overlay{position:fixed;inset:0;background:rgba(58,46,39,0.55);z-index:100;
    display:none;align-items:center;justify-content:center;padding:20px;}
  .growth-card{background:#fff;border-radius:20px;padding:30px 24px 24px;text-align:center;
    max-width:300px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,0.28);}
  .growth-avatar{width:150px;height:255px;display:flex;align-items:flex-end;justify-content:center;margin:0 auto 18px;overflow:visible;}
  .growth-avatar svg{width:100%;height:100%;transform-origin:bottom center;
    transition:transform 0.8s cubic-bezier(.34,1.56,.64,1);}
  .growth-avatar.growing svg{transform:scaleY(var(--grow-scale,1)) scaleX(1.04);}
  .growth-avatar.shake svg{animation:pencilShake 0.5s ease;}
  @keyframes pencilShake{
    0%,100%{transform:translateX(0) rotate(0deg);}
    20%{transform:translateX(-5px) rotate(-4deg);}
    40%{transform:translateX(5px) rotate(4deg);}
    60%{transform:translateX(-4px) rotate(-3deg);}
    80%{transform:translateX(3px) rotate(2deg);}
  }
  .growth-msg-hi{font-family:var(--font-head);font-size:19px;font-weight:800;color:var(--accent-dark);margin:0 0 3px;}
  .growth-msg-en{font-size:12.5px;color:var(--muted);margin:0;}
  .growth-child-hint{font-size:12px;font-weight:700;color:var(--accent-dark);margin:10px 0 0;}
  .growth-child-hint .en{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:1px;}
  .growth-tap-hint{font-size:10.5px;color:var(--muted);margin-top:16px;}
</style>
</head>
<body>
<button class="home-btn" id="homeBtn" aria-label="Home">
  <span class="icon">🏠</span>
</button>
<span class="logo-badge" id="logoIcon" aria-label="Kalam"></span>
<div class="growth-overlay" id="growthOverlay"></div>
<div class="wrap">
  <header class="top" id="appHeader">
    <div class="logo-text">कलम<span class="en">Kalam</span></div>
    <div class="tracker" id="progressTracker">
      <div class="tracker-track"><div class="tracker-fill" id="progressFill"></div></div>
      <p class="tracker-text" id="progressText"></p>
    </div>
  </header>

  <!-- Page 1: pick the month -->
  <div class="page" id="page-month">
    <div class="card">
      <h3>इस महीने</h3>
      <div class="h3-en">This month</div>
      <select id="monthSelect"></select>
      <button class="btn" id="monthNextBtn">आगे बढ़ें<span class="en">Next</span></button>
    </div>
  </div>

  <!-- Page 2: what do you have -->
  <div class="page" id="page-menu" style="display:none;">
    <div class="card" id="fallbackCard">
      <h3>यहाँ क्या है?</h3>
      <div class="h3-en">What do you have here?</div>
      <div class="grid3" id="tileGrid"></div>
    </div>
    <div class="card" id="followupCard" style="display:none;">
      <h3 id="followupQ"></h3>
      <div class="yesno">
        <button class="btn secondary" id="yesBtn">हाँ<span class="en">Yes</span></button>
        <button class="btn ghost" id="noBtn">नहीं<span class="en">No</span></button>
      </div>
    </div>
  </div>

  <!-- Page 3: the activity, full screen, one at a time -->
  <div class="page" id="page-activity" style="display:none;">
    <div id="activityWrap"></div>
  </div>

  <!-- Page 4: check-in -->
  <div class="page" id="page-checkin" style="display:none;">
    <div id="checkinWrap"></div>
  </div>

</div>

  // ---------- On-device persistence (localStorage only — never sent anywhere) ----------
  // Stores: the child's name, and a log of completed activities with their check-in
  // ratings. Survives reloads/app restarts on this phone so the avatar can grow and
  // (from month 4) a real pattern across months can inform the next month's activity —
  // neither of which is possible with in-memory-only state. Still fully local: nothing
  // here is transmitted unless a later feature (teacher reporting) explicitly sends it.
  const STORAGE_KEY = "humaraSaathiState";

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return { completions: [] };
      const parsed = JSON.parse(raw);
      if(!parsed || typeof parsed !== "object") return { completions: [] };
      if(!Array.isArray(parsed.completions)) parsed.completions = [];
      return parsed;
    }catch(e){
      console.warn("Could not read saved progress — starting fresh.", e);
      return { completions: [] };
    }
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
    }catch(e){
      // Storage can fail (private browsing, full storage, disabled). The app still
      // works for this one session — it just won't remember progress next time.
      console.warn("Could not save progress.", e);
    }
  }

  let appState = loadState();

  // faces: object like { "0":"easy", "1":"help", "opt0":"hard" } — same keys the
  // check-in UI already uses, so nothing needs remapping when we read this back later.
  function recordCompletion(month, activity, faces, tier){
    appState.completions.push({
      ts: Date.now(),
      month: month,
      activityTitleEn: activity.title_en,
      category: activity.category,
      tier: tier || "on-level",
      faces: faces || {}
    });
    saveState();
    updateTracker();
  }

  function getTotalCompleted(){
    return appState.completions.length;

  function getMonthCompletions(month){
    return appState.completions.filter(c => c.month === month);
  }

  // ---------- Adaptive tier decision (hand-written rules, not ML — see project notes) ----------
  // June-August have no tiered content, so always on-level there. From September, look
  // only at the immediately preceding month's pattern — not a single rating, not a long
  // history — to suggest easier/on-level/harder for the month about to be shown.
  const TIER_START_MONTH = "sep";

  function classifyActivityOutcome(faces){
    const values = Object.values(faces || {});
    if(values.length === 0) return "neutral"; // submitted with no faces picked — no signal either way
    const counts = { easy: 0, help: 0, hard: 0 };
    values.forEach(v => { if(counts[v] !== undefined) counts[v]++; });
    if(counts.hard > values.length / 2) return "struggled";
    if(counts.easy > values.length / 2) return "easy";
    return "neutral"; // mostly "needed help", or a mixed split — no strong signal
  }

  function getSuggestedTier(month){
    const monthIndex = MODULES.findIndex(m => m.id === month);
    const tierStartIndex = MODULES.findIndex(m => m.id === TIER_START_MONTH);
    if(monthIndex < 0 || monthIndex < tierStartIndex) return "on-level";

    const prevMonth = MODULES[monthIndex - 1];
    if(!prevMonth) return "on-level";

    const prevCompletions = getMonthCompletions(prevMonth.id);
    if(prevCompletions.length < 2) return "on-level"; // not enough of that month done to read a pattern

    const outcomes = prevCompletions.map(c => classifyActivityOutcome(c.faces));
    const struggled = outcomes.filter(o => o === "struggled").length;
    const easy = outcomes.filter(o => o === "easy").length;

    if(struggled >= 2) return "easier";
    if(easy >= 2) return "harder";
    return "on-level";
  }

  function stageOf(n){ return Math.min(5, Math.floor(n / 5)); }
  function pencilMarkup(stage){
    return `<svg viewBox="0 0 200 340" xmlns="http://www.w3.org/2000/svg">${PENCIL_STAGES[stage]}</svg>`;
  }
  // Each stage's own total height within the shared viewBox (tip to base) — used only
  // to compute a scale ratio for the grow animation between two stages.
  const PENCIL_HEIGHTS = [154, 180, 206, 232, 258, 284];

  // Header logo: a fixed, non-growing pose (stage 3), set once on load.
  $("logoIcon").innerHTML = pencilMarkup(3);

  // Shown right after a check-in is submitted — the actual reward moment. Two scenes:
  // praise first, then the pencil visibly grows taller into its new stage (same fixed
  // display box throughout, since all stages share one viewBox anchored to the same
  // base — no container resizing needed). Tap anywhere to skip ahead/dismiss early.
  function showGrowthCelebration(beforeTotal, afterTotal){
    const overlay = $("growthOverlay");
    const beforeStage = stageOf(beforeTotal);
    const afterStage = stageOf(afterTotal);
    const grew = afterStage > beforeStage;

    overlay.innerHTML = `
      <div class="growth-card">
        <div class="growth-avatar" id="growthAvatar">
          ${pencilMarkup(beforeStage)}
        </div>
        <p class="growth-msg-hi" id="growthMsgHi">बहुत बढ़िया!</p>
        <p class="growth-msg-en" id="growthMsgEn">Great work!</p>
        <p class="growth-child-hint">हर गतिविधि के साथ यह थोड़ा बढ़ता है — बच्चे को ज़रूर दिखाएं!<span class="en">It grows a little with every activity — show it to your child!</span></p>
        <p class="growth-tap-hint">आगे बढ़ने के लिए टैप करें / Tap to continue</p>
      </div>
    `;
    overlay.style.display = "flex";
    overlay.onclick = () => { overlay.style.display = "none"; resetApp(); };

    const growTimer = setTimeout(() => {
      const avatarEl = $("growthAvatar");
      const msgHi = $("growthMsgHi");
      const msgEn = $("growthMsgEn");
      if(!avatarEl) return;
      if(msgHi) msgHi.textContent = "फिर मिलेंगे!";
      if(msgEn) msgEn.textContent = "See you soon!";

      // A little celebratory wiggle — every completion gets one, not just the
      // ones that cross a growth stage, so there's always some visible response.
      const doShake = () => {
        avatarEl.classList.add("shake");
        setTimeout(() => avatarEl.classList.remove("shake"), 550);
      };

      if(!grew){ doShake(); return; }

      // Stretch the current (before) pencil taller first — a visible "growing"
      // motion — then swap in the crisp, correctly-proportioned after-stage art
      // once the stretch settles, so the final pose is never actually distorted.
      const scale = PENCIL_HEIGHTS[afterStage] / PENCIL_HEIGHTS[beforeStage];
      avatarEl.style.setProperty("--grow-scale", scale);
      avatarEl.classList.add("growing");
      let settled = false;
      const settle = () => {
        if(settled) return;
        settled = true;
        avatarEl.innerHTML = pencilMarkup(afterStage);
        avatarEl.classList.remove("growing");
        avatarEl.style.removeProperty("--grow-scale");
        doShake();
      };
      const svgEl = avatarEl.querySelector("svg");
      if(svgEl) svgEl.addEventListener("transitionend", settle, { once: true });
      setTimeout(settle, 900); // fallback in case transitionend doesn't fire
    }, 1400);

    setTimeout(() => {
      clearTimeout(growTimer);
      overlay.style.display = "none";
      resetApp();
    }, 3400);
  }

  function populateMonths(){
    const sel = $("monthSelect");
    MODULES.forEach((m,i)=>{
      const opt = document.createElement("option");
      opt.value = m.id;
      opt.textContent = m.hi + " (" + m.en + ") — " + m.title_hi;
      if(i===0) opt.selected = true;
      sel.appendChild(opt);
    });
  }
  populateMonths();

  // Slim progress bar in the header, visible on every page — a lighter-weight
  // stand-in for the old always-visible avatar card, kept purely as a number/bar
  // so the pencil itself stays reserved for the growth-celebration moment only.
  function updateTracker(){
    const total = getTotalCompleted();
    const pct = Math.min(100, Math.round((total / TOTAL_ACTIVITIES) * 100));
    $("progressFill").style.width = pct + "%";
    $("progressText").textContent = `${total}/${TOTAL_ACTIVITIES} गतिविधियाँ पूरी / activities completed`;
  }
  updateTracker();

  // ---------- Page-by-page navigation ----------
  // Only one .page is ever visible at a time — everything else is a hidden sibling.
  function showPage(id){
    document.querySelectorAll(".page").forEach(p => { p.style.display = "none"; });
    $(id).style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  $("monthNextBtn").addEventListener("click", () => showPage("page-menu"));

  function speakHindi(text){
    if(!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "hi-IN";
    u.rate = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }

  // ---------- Fallback tap menu ----------
  function renderTiles(){
    const grid = $("tileGrid");
    grid.innerHTML = "";
    const colors = ["#FAEEDA","#E1F5EE","#FAECE7","#E6F1FB","#EEEDFE","#F1EFE8"];
    TILES.forEach((t, i) => {
      const btn = document.createElement("button");
      btn.className = "tile";
      btn.innerHTML = `<div class="photo" style="background:${colors[i % colors.length]}"></div>
        <div class="label"><p class="hi">${t.hi}</p><p class="en">${t.en}</p></div>`;
      btn.addEventListener("click", () => selectCategory(t.key === "other" ? "mixed" : t.key));
      grid.appendChild(btn);
    });
  }
  renderTiles();

  function resetApp(){
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    currentCategory = null;
    hasMultipleColours = null;
    hasMultipleSizes = null;
    currentActivity = null;
    currentTier = "on-level";
    $("fallbackCard").style.display = "block";
    $("followupCard").style.display = "none";
    $("activityWrap").innerHTML = "";
    $("checkinWrap").innerHTML = "";
    showPage("page-month");
  }
  $("homeBtn").addEventListener("click", resetApp);

  // Testing-only affordance: long-press the logo badge (~1.2s) to wipe all saved
  // progress and start over from 0/30 — not something a parent would stumble
  // into by accident, but saves digging through browser settings between test
  // rounds. Confirms before actually clearing anything.
  (function setupTestReset(){
    const el = $("logoIcon");
    if(!el) return;
    let pressTimer = null;
    let startX = 0, startY = 0;
    const MOVE_TOLERANCE = 15; // px — a real finger can't hold perfectly still for 1.2s,
                                // so only cancel on a genuine drag, not tiny jitter.

    const doReset = () => {
      const ok = window.confirm("टेस्टिंग रीसेट — सारी सेव की गई प्रगति मिटाएं?\nReset for testing — clear all saved progress?");
      if(ok){
        try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
        window.location.reload();
      }
    };
    const startPress = (x, y) => {
      startX = x; startY = y;
      pressTimer = setTimeout(doReset, 1200);
    };
    const cancelPress = () => { if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };
    const checkMove = (x, y) => {
      if(Math.abs(x - startX) > MOVE_TOLERANCE || Math.abs(y - startY) > MOVE_TOLERANCE) cancelPress();
    };

    el.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      if(t) startPress(t.clientX, t.clientY);
    }, { passive: true });
    el.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      if(t) checkMove(t.clientX, t.clientY);
    }, { passive: true });
    el.addEventListener("touchend", cancelPress);
    el.addEventListener("touchcancel", cancelPress);
    el.addEventListener("mousedown", (e) => startPress(e.clientX, e.clientY));
    el.addEventListener("mousemove", (e) => { if(pressTimer) checkMove(e.clientX, e.clientY); });
    el.addEventListener("mouseup", cancelPress);
    el.addEventListener("mouseleave", cancelPress);
  })();

  function selectCategory(cat){
    currentCategory = cat;
    $("fallbackCard").style.display = "none";
    askFollowup();
  }

  function askFollowup(){
    if(currentCategory === "pulses" || currentCategory === "vegetables"){
      showColourQuestion();
    } else {
      finalizeAndShow();
    }
  }

  function showColourQuestion(){
    $("followupCard").style.display = "block";
    $("followupQ").innerHTML = "क्या एक से ज़्यादा रंग हैं?<br><span style='font-size:12px;color:var(--muted);font-weight:500;'>Do you have more than one colour?</span>";
    $("yesBtn").onclick = () => { hasMultipleColours = true; afterColourQuestion(); };
    $("noBtn").onclick = () => { hasMultipleColours = false; afterColourQuestion(); };
  }

  function afterColourQuestion(){
    // Only pulses activities currently depend on size variety (e.g. December's
    // big/small sorting) — no vegetables activity does, so we skip the extra
    // tap there rather than ask a question with no payoff.
    if(currentCategory === "pulses"){
      showSizeQuestion();
    } else {
      finalizeAndShow();
    }
  }

  function showSizeQuestion(){
    $("followupQ").innerHTML = "क्या अलग-अलग आकार हैं — कुछ बड़े, कुछ छोटे?<br><span style='font-size:12px;color:var(--muted);font-weight:500;'>Do you have different sizes — some big, some small?</span>";
    $("yesBtn").onclick = () => { hasMultipleSizes = true; finalizeAndShow(); };
    $("noBtn").onclick = () => { hasMultipleSizes = false; finalizeAndShow(); };
  }

  function finalizeAndShow(){
    $("followupCard").style.display = "none";
    showActivities();
  }

  // How many of an activity's stated material needs the parent has told us
  // they DON'T have (via the colour/size follow-up, or camera colour sampling).
  // null = unknown/not asked, so it never counts against an activity.
  function unmetNeeds(a){
    if(!a.needs) return 0;
    let count = 0;
    if(a.needs.includes("colour") && hasMultipleColours === false) count++;
    if(a.needs.includes("size") && hasMultipleSizes === false) count++;
    return count;
  }

  // Swaps in an activity's easier/harder materials+steps+fallback when that tier
  // exists and is suggested; title/skill tag/check-in questions stay the same either
  // way, since the underlying goal being practiced doesn't change, only how it's asked.
  // The parent never sees "easier"/"harder" anywhere — it's silent by design.
  function applyTier(activity, tier){
    if(tier === "on-level" || !activity.tiers || !activity.tiers[tier]) return activity;
    const t = activity.tiers[tier];
    return Object.assign({}, activity, {
      materials_hi: t.materials_hi, materials_en: t.materials_en,
      steps: t.steps, fallback: t.fallback
    });
  }

  function showActivities(){
    const month = $("monthSelect").value;
    const suggestedTier = getSuggestedTier(month);
    console.log(`[adaptive] ${month}: suggested tier = ${suggestedTier}`);
    const all = ACTIVITIES[month] || [];
    let matches = all.filter(a => {
      if(currentCategory === "mixed"){
        // "Something else" tap: every household has utensils regardless of what
        // pulses/vegetables/spices/dough they have, so treat utensils activities
        // as a safe universal match too, not just ones explicitly tagged mixed/any.
        return a.category === "mixed" || a.category === "any" || a.category === "utensils";
      }
      return a.category === currentCategory || a.category === "any" || a.category === "mixed";
    });
    // Some months don't have any activity tagged for the exact category tapped
    // (e.g. August has no "pulses" activity — its theme that month is shapes).
    // Falling back to literally every activity in the month was a real bug: it
    // could hand back something totally unrelated to what the parent said they
    // have (a dough activity after tapping "pulses"). Fall back to utensils
    // only instead — every household has utensils regardless of category — and
    // only fall back to everything as a last resort that should rarely trigger.
    if(matches.length === 0) matches = all.filter(a => a.category === "utensils");
    if(matches.length === 0) matches = all;

    // Don't keep re-showing the same activity once it's already been done this
    // month — work through the rest first, so a parent doing several rounds in
    // one sitting actually reaches everything available instead of one activity
    // on repeat. Once every match for this category+month is done, say so.
    const doneThisMonth = new Set(getMonthCompletions(month).map(c => c.activityTitleEn));
    const notYetDone = matches.filter(a => !doneThisMonth.has(a.title_en));
    if(notYetDone.length === 0){
      renderMonthCompletePage();
      showPage("page-activity");
      return;
    }

    // Rank an exact category match above any/mixed/utensils catch-alls first —
    // this was the other real bug: a generic "mixed" activity could outrank the
    // actual pulses activity just because the pulses one needed a colour/size
    // variety the parent said they don't have. Only within the same relevance
    // tier do we then push unmet-material activities toward the bottom.
    const pool = notYetDone.slice().sort((a, b) => {
      const aExact = (a.category === currentCategory) ? 0 : 1;
      const bExact = (b.category === currentCategory) ? 0 : 1;
      if(aExact !== bExact) return aExact - bExact;
      return unmetNeeds(a) - unmetNeeds(b);
    });
    // One activity per round, not a list of 3 — matches the page-by-page,
    // one-thing-at-a-time flow instead of overwhelming the parent with choices.
    currentActivity = applyTier(pool[0], suggestedTier);
    currentTier = suggestedTier;
    renderActivityPage(currentActivity, suggestedTier);
    showPage("page-activity");
  }

  // A friendly stop, shown in place of an activity once every match for the
  // tapped category has already been logged this month — reachable by trying
  // a different category, or waiting for next month's activities to unlock.
  function renderMonthCompletePage(){
    const wrap = $("activityWrap");
    wrap.innerHTML = `
      <div class="card activity" style="text-align:center;">
        <h4>शानदार! यह सब हो गया<span class="en">Amazing — you've done everything here for this month</span></h4>
        <p style="color:var(--muted);font-size:13.5px;margin-top:10px;line-height:1.5;">
          कोई और चीज़ चुनकर देखें, या अगले महीने वापस आएं।
          <span class="en" style="display:block;margin-top:3px;">Try picking something else, or come back next month.</span>
        </p>
        <button class="btn done-btn" id="monthCompleteBackBtn">वापस जाएं<span class="en">Go back</span></button>
      </div>
    `;
    $("monthCompleteBackBtn").addEventListener("click", () => {
      $("activityWrap").innerHTML = "";
      $("fallbackCard").style.display = "block";
      $("followupCard").style.display = "none";
      showPage("page-menu");
    });
  }

  // Face taps live here per-activity as the parent goes; only written into the
  // persisted completion log (above) when "Submit" is actually pressed.
  const checkInResponses = {};
  const FACES = [
    { key:"easy", face:"😊", hi:"आसानी से", en:"Easily" },
    { key:"help", face:"😐", hi:"मदद चाहिए थी", en:"Needed help" },
    { key:"hard", face:"😟", hi:"मुश्किल हुई", en:"Struggled" }
  ];

  // Shown as a small pill above each activity — lets Prathiba visually confirm the
  // adaptive logic is doing something (not hidden in the console), and gives parents
  // gentle context without ever using a discouraging word like "hard."
  const TIER_LABELS = {
    easier: { hi: "आज: थोड़ा आसान", en: "Today: a bit easier" },
    "on-level": { hi: "आज: सामान्य स्तर", en: "Today: usual level" },
    harder: { hi: "आज: थोड़ा चुनौतीपूर्ण", en: "Today: a bit more challenging" }
  };

  // Explicit, visible notes for the two situations that used to be silent
  // substitutions — telling the parent plainly why they're seeing something
  // different from what they tapped or asked for, instead of leaving them to
  // wonder (or feel like the app just isn't listening to what they picked).
  function getActivityNote(act){
    if(currentCategory !== "mixed" && act.category !== currentCategory && act.category !== "any" && act.category !== "mixed"){
      return {
        hi: "इस महीने उससे जुड़ी कोई गतिविधि नहीं थी, तो यहाँ एक और गतिविधि दी गई है — जो हर घर में मिलने वाली चीज़ों से हो सकती है।",
        en: "There wasn't an activity for that this month, so here's a different one instead — using things every home has."
      };
    }
    if(unmetNeeds(act) > 0){
      return {
        hi: "इस गतिविधि के लिए थोड़ी और अलग चीज़ें हों तो बेहतर है। जो आपके पास नहीं, उसके लिए नीचे दिया आसान तरीक़ा अपनाएं।",
        en: "This works best with a bit more variety than you have. For what's missing, use the simpler approach in the instructions below."
      };
    }
    return null;
  }

  // Page 3: the single matched activity, full-screen — instructions, materials,
  // fallback, read-aloud, and a "Done" button that moves on to the check-in page.
  function renderActivityPage(act, tier){
    const wrap = $("activityWrap");
    const label = TIER_LABELS[tier] || TIER_LABELS["on-level"];
    const note = getActivityNote(act);
    const noteHtml = note ? `<div class="activity-note">ℹ️ ${note.hi}<span class="en">${note.en}</span></div>` : "";
    const stepsHtml = act.steps.map(s => `<li>${s.hi}<span class="en">${s.en}</span></li>`).join("");
    wrap.innerHTML = `
      <div class="card activity">
        <span class="tier-pill">${label.hi}<span class="en"> · ${label.en}</span></span>
        <h4>${act.title_hi}<span class="en">${act.title_en}</span></h4>
        <div class="meta">🧺 ${act.materials_hi} / ${act.materials_en} · ⏱ ${act.minutes}</div>
        ${noteHtml}
        <ol>${stepsHtml}</ol>
        <div class="fallback"><strong>अगर बच्चा न समझे:</strong> ${act.fallback.hi}<span class="en">If the child doesn't understand: ${act.fallback.en}</span></div>
        <span class="skill-tag">${act.skill_hi}<span class="en"> · ${act.skill_en}</span></span><br>
        <button class="speak-btn">🔊 सुनें / Read aloud</button>
        <button class="btn done-btn" id="activityDoneBtn">हो गया, पूरा किया! <span class="en">Done, we finished!</span></button>
      </div>
    `;
    wrap.querySelector(".speak-btn").addEventListener("click", () => {
      const fullHi = act.title_hi + "। " + act.steps.map(s=>s.hi).join("। ") + "। " + act.fallback.hi;
      speakHindi(fullHi);
    });
    $("activityDoneBtn").addEventListener("click", () => {
      renderCheckinPage(act);
      showPage("page-checkin");
    });
  }

  // Page 4: check-in questions for the one activity just finished, then submit —
  // records the completion and hands off to the growth celebration.
  function renderCheckinPage(act){
    const wrap = $("checkinWrap");
    const ciQs = [{hi:UNIVERSAL_FIRST_Q_HI, en:UNIVERSAL_FIRST_Q_EN}, ...(act.checkIn || [])];
    const ciOptional = act.checkInOptional || [];
    const questionBlock = (qs, groupPrefix) => qs.map((q, qi) => `
          <p class="ci-q">${q.hi}</p>
          <p class="ci-q-en">${q.en}</p>
          <div class="ci-faces" data-q="${groupPrefix}${qi}">
            ${FACES.map(f => `<button data-face="${f.key}">${f.face}<span>${f.hi}</span></button>`).join("")}
          </div>
        `).join("");

    wrap.innerHTML = `
      <div class="card checkin">
        <p class="ci-title">यह करने के बाद — कैसा रहा? <span style="font-weight:500;color:var(--muted);">/ After you try this — how did it go?</span></p>
        ${questionBlock(ciQs, "")}
        ${ciOptional.length ? `
          <p class="ci-title" style="margin-top:10px;">ज़रूरी नहीं — अगर आगे बढ़ना चाहें <span style="font-weight:500;color:var(--muted);">/ Optional</span></p>
          ${questionBlock(ciOptional, "opt")}
        ` : ""}
        <button class="btn checkin-submit">जमा करें / Submit</button>
        <p class="checkin-saved-msg">✓ सेव हो गया, धन्यवाद! / Saved, thank you!</p>
      </div>
    `;
    wrap.querySelectorAll(".ci-faces").forEach(group => {
      group.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", () => {
          group.querySelectorAll("button").forEach(b => b.classList.remove("picked"));
          btn.classList.add("picked");
          const key = act.title_en + "|" + group.dataset.q;
          checkInResponses[key] = btn.dataset.face;
        });
      });
    });
    const submitBtn = wrap.querySelector(".checkin-submit");
    const savedMsg = wrap.querySelector(".checkin-saved-msg");
    submitBtn.addEventListener("click", () => {
      if(submitBtn.classList.contains("saved")) return; // guard against double-counting on repeat taps
      submitBtn.classList.add("saved");
      submitBtn.textContent = "✓ सेव हो गया / Saved";
      savedMsg.style.display = "block";

      const prefix = act.title_en + "|";
      const faces = {};
      Object.keys(checkInResponses).forEach(key => {
        if(key.startsWith(prefix)) faces[key.slice(prefix.length)] = checkInResponses[key];
      });
      const month = $("monthSelect").value;
      const beforeTotal = getTotalCompleted();
      recordCompletion(month, act, faces, currentTier);
      setTimeout(() => {
        showGrowthCelebration(beforeTotal, getTotalCompleted());
      }, 500);
    });
  }

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW registration failed", err));
  }
})();
</script>
</body>
</html>
